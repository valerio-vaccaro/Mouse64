name: Build firmware

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile firmware
        run: pio run
      - name: Package for DIY Flasher
        run: python scripts/package_firmware.py
      - uses: actions/upload-artifact@v6
        with:
          name: mouse64-firmware
          path: dist/
          if-no-files-found: error
